<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greek Web — Graph Debug View</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <h1>Greek Web</h1>
      <p class="muted">Word graph debug view</p>
      <label class="field">
        <span>Search lexeme</span>
        <input id="search" type="search" placeholder="γράφω">
      </label>
      <div id="lexeme-list" class="lexeme-list"></div>
    </aside>

    <section class="content">
      <div class="toolbar">
        <button id="lang-ru" type="button">RU</button>
        <button id="lang-en" type="button">EN</button>
      </div>
      <div id="details"></div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
